version: '3.8'

services:
  influxdb:
    image: influxdb:1.8
    restart: always
    ports:
      - "8086:8086"
    environment:
        DOCKER_INFLUXDB_INIT_USERNAME: root
        DOCKER_INFLUXDB_INIT_PASSWORD: root
        DOCKER_INFLUXDB_INIT_ORG: org
        DOCKER_INFLUXDB_INIT_BUCKET: bkt
    volumes:
        - ./.docker/influxdb:/var/lib/influxdb
    networks: 
      - influxdb

networks:
  influxdb:
    driver: bridge